name: checks

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static checks
        run: python tools/check_as.py
      - name: Documentation style
        run: python tools/check_style.py
      - name: Contract tests
        shell: pwsh
        run: ./tests/run_tests.ps1
